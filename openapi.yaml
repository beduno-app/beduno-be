openapi: 3.1.0
info:
  title: Beduno API
  description: Worker housing management system for temporary work agencies
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Auth
  description: Authentication and token management
- name: Rooms
  description: Room management nested under a property
- name: Workers
  description: Worker CRUD and CSV import
- name: Beds
  description: Bed management nested under a room
- name: Stays
  description: "Stay lifecycle: plan, check-in, check-out, move, bulk operations"
- name: Properties
  description: Property management
- name: Audit
  description: Immutable audit trail of all changes
- name: Occupancy
  description: "Occupancy views, exceptions, inspection, and CSV exports"
- name: Users
  description: Agency user management (admin-only)
paths:
  /api/v1/workers/{id}:
    get:
      tags:
      - Workers
      summary: Get worker by ID
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkerResponse"
    put:
      tags:
      - Workers
      summary: Update worker
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkerRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkerResponse"
    delete:
      tags:
      - Workers
      summary: Delete worker
      description: Soft-deletes the worker
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Worker deleted
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      summary: Get user by ID
      operationId: findById_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - Users
      summary: Update user
      description: "Email, name, role, language, assigned properties, and status"
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "409":
          description: "Email already in use, or this is the agency's last active\
            \ admin"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - Users
      summary: Deactivate user
      description: "Sets status to INACTIVE. Never a hard delete: users are referenced\
        \ by history (e.g. confirmed stays)."
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "409":
          description: "Cannot deactivate yourself, or the agency's last active admin"
        "204":
          description: User deactivated
  /api/v1/stays/{id}:
    get:
      tags:
      - Stays
      summary: Get stay by ID
      operationId: findById_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StayResponse"
    put:
      tags:
      - Stays
      summary: Update stay
      description: Change dates or room. Runs constraint engine.
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStayRequest"
        required: true
      responses:
        "422":
          description: Constraint violation
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StayResponse"
    delete:
      tags:
      - Stays
      summary: Cancel stay
      operationId: cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Stay cancelled
  /api/v1/properties/{propertyId}/rooms/{roomId}:
    get:
      tags:
      - Rooms
      summary: Get room by ID
      operationId: findById_3
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomResponse"
    put:
      tags:
      - Rooms
      summary: Update room
      operationId: update_3
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomResponse"
    delete:
      tags:
      - Rooms
      summary: Delete room
      description: Permanently deletes the room. Refused while any stay still references
        it.
      operationId: delete_1
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Room deleted
        "409":
          description: Room still has referencing stays
  /api/v1/properties/{propertyId}/rooms/{roomId}/beds/{bedId}:
    get:
      tags:
      - Beds
      summary: Get bed by ID
      operationId: findById_4
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: bedId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BedResponse"
    put:
      tags:
      - Beds
      summary: Update bed (rename or change status)
      operationId: update_4
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: bedId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBedRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BedResponse"
    delete:
      tags:
      - Beds
      summary: Delete bed
      description: Permanently deletes the bed.
      operationId: delete_2
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: bedId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Bed deleted
  /api/v1/properties/{id}:
    get:
      tags:
      - Properties
      summary: Get property by ID
      operationId: findById_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PropertyResponse"
    put:
      tags:
      - Properties
      summary: Update property
      operationId: update_5
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PropertyResponse"
    delete:
      tags:
      - Properties
      summary: Delete property
      description: Permanently deletes the property. Refused while any room or stay
        still references it.
      operationId: delete_3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "409":
          description: Property still has rooms or referencing stays
        "204":
          description: Property deleted
  /api/v1/workers:
    get:
      tags:
      - Workers
      summary: List workers
      description: "Paginated list with optional filters: status, gender, tag, name\
        \ search"
      operationId: findAll
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - DELETED
      - name: gender
        in: query
        required: false
        schema:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
      - name: tag
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseWorkerResponse"
    post:
      tags:
      - Workers
      summary: Create worker
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerRequest"
        required: true
      responses:
        "201":
          description: Worker created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkerResponse"
  /api/v1/workers/import:
    post:
      tags:
      - Workers
      summary: Import workers from CSV
      description: "Parse and create workers from a CSV file. Returns per-row summary:\
        \ created/skipped/errors"
      operationId: importCsv
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkerImportResult"
  /api/v1/users:
    get:
      tags:
      - Users
      summary: List users
      description: "Paginated list with optional filters: role, status, name/email\
        \ search"
      operationId: findAll_1
      parameters:
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - AGENCY_ADMIN
          - AGENCY_PLANNER
          - PROPERTY_ADMIN
          - FRONT_DESK
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
    post:
      tags:
      - Users
      summary: Create user
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "409":
          description: Email already in use
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "201":
          description: User created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/stays:
    get:
      tags:
      - Stays
      summary: List stays
      description: "Paginated list filterable by worker, property, status, and date\
        \ range"
      operationId: findAll_2
      parameters:
      - name: workerId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: propertyId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PLANNED
          - EXPECTED_TODAY
          - CHECKED_IN
          - CHECKED_OUT
          - CANCELLED
          - NO_SHOW
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseStayResponse"
    post:
      tags:
      - Stays
      summary: Plan a stay
      description: Creates a planned stay. Runs constraint engine — returns 422 with
        violations if hard constraints are breached.
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStayRequest"
        required: true
      responses:
        "201":
          description: Stay planned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StayResponse"
        "422":
          description: Constraint violation
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StayResponse"
  /api/v1/stays/{id}/no-show:
    post:
      tags:
      - Stays
      summary: No-show
      description: Mark a stay as no_show with a reason tag
      operationId: noShow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoShowRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StayResponse"
  /api/v1/stays/{id}/move:
    post:
      tags:
      - Stays
      summary: Move worker to another room
      description: "Atomic operation: checks out from current room, creates new stay\
        \ in target room"
      operationId: move
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveRequest"
        required: true
      responses:
        "422":
          description: Constraint violation on target room
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StayResponse"
  /api/v1/stays/{id}/check-out:
    post:
      tags:
      - Stays
      summary: Check out
      description: Transitions a checked_in stay to checked_out. Sets actual departure
        date if different from planned.
      operationId: checkOut
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckOutRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StayResponse"
  /api/v1/stays/{id}/check-in:
    post:
      tags:
      - Stays
      summary: Check in
      description: Transitions an expected_today stay to checked_in. Runs constraint
        engine. Optionally overrides room.
      operationId: checkIn
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInRequest"
        required: true
      responses:
        "422":
          description: Constraint violation — re-submit with overrideReason to force
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StayResponse"
  /api/v1/stays/bulk-checkout:
    post:
      tags:
      - Stays
      summary: Bulk checkout stays
      description: Checks out multiple checked_in stays in one call. Returns per-item
        results.
      operationId: bulkCheckout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCheckoutRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkCheckoutResult"
  /api/v1/stays/bulk-assign:
    post:
      tags:
      - Stays
      summary: Bulk assign stays
      description: Creates multiple planned stays in one call. Returns per-item results
        including constraint violations.
      operationId: bulkAssign
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssignRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkAssignResult"
  /api/v1/properties:
    get:
      tags:
      - Properties
      summary: List properties
      description: Paginated list with optional status and name filters
      operationId: findAll_3
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponsePropertyResponse"
    post:
      tags:
      - Properties
      summary: Create property
      operationId: create_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
        required: true
      responses:
        "201":
          description: Property created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PropertyResponse"
  /api/v1/properties/{propertyId}/rooms:
    get:
      tags:
      - Rooms
      summary: List rooms in a property
      operationId: findAll_4
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseRoomResponse"
    post:
      tags:
      - Rooms
      summary: Create room
      operationId: create_4
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
        required: true
      responses:
        "201":
          description: Room created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoomResponse"
  /api/v1/properties/{propertyId}/rooms/{roomId}/beds:
    get:
      tags:
      - Beds
      summary: List beds in a room
      operationId: findAll_5
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BedResponse"
    post:
      tags:
      - Beds
      summary: Create a single bed
      operationId: create_5
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBedRequest"
        required: true
      responses:
        "201":
          description: Bed created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BedResponse"
  /api/v1/properties/{propertyId}/rooms/{roomId}/beds/bulk-generate:
    post:
      tags:
      - Beds
      summary: Bulk-generate beds
      description: Adds count sequentially numbered beds after the room's current
        highest numeric label
      operationId: bulkGenerate
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roomId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkGenerateBedsRequest"
        required: true
      responses:
        "201":
          description: Beds created
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BedResponse"
  /api/v1/properties/{propertyId}/inspection:
    get:
      tags:
      - Occupancy
      summary: Inspection roster
      description: Room-by-room roster for nightly inspection
      operationId: getInspectionRoster
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectionRoomEntry"
    post:
      tags:
      - Occupancy
      summary: Submit inspection report
      description: "Reports discrepancies: expected workers not present, unexpected\
        \ workers present"
      operationId: submitInspectionReport
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionReportRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InspectionDiscrepancyResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh token
      description: Exchange a valid refresh token for a new token pair
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: Tokens refreshed
          content:
