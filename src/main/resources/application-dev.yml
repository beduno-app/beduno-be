spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/beduno
    username: beduno
    password: beduno
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.beduno: DEBUG
    org.springframework.security: DEBUG

beduno:
  jwt:
    secret: ${JWT_SECRET:beduno-dev-secret-key-that-is-at-least-256-bits-long-for-hs256}
  # Local dev only: populate a demo agency on first run against the empty local Postgres so there
  # is something to click through. Set BEDUNO_SEED_ENABLED=false to opt out.
  seed:
    enabled: ${BEDUNO_SEED_ENABLED:true}
