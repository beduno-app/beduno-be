spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/beduno
    username: beduno
    password: beduno
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.beduno: DEBUG
    org.springframework.security: DEBUG

beduno:
  jwt:
    secret: ${JWT_SECRET:beduno-dev-secret-key-that-is-at-least-256-bits-long-for-hs256}
