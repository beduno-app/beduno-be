spring:
  application:
    name: beduno-be
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: jdbc:postgresql://localhost:5432/beduno
    username: beduno
    password: beduno
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

beduno:
  # Creates the first agency and administrator on an empty database, then does nothing on every
  # later start. Off by default; see the deployment runbook in README.md.
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    agency-name: ${BOOTSTRAP_AGENCY_NAME:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Agency}
    admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Admin}
    admin-language: ${BOOTSTRAP_ADMIN_LANGUAGE:PL}
  # Populates a demo agency (users, workers, properties, rooms, beds, stays) on an empty database,
  # then does nothing on every later start. Off by default -- see SeedRunner. Local dev turns this
  # on by default; see application-dev.yml.
  seed:
    enabled: ${BEDUNO_SEED_ENABLED:false}
  scheduler:
    arrival-transition-cron: "0 0 6 * * *"
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
