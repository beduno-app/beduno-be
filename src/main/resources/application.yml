spring:
  application:
    name: bedok-be
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: jdbc:postgresql://localhost:5432/bedok
    username: bedok
    password: bedok
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

bedok:
  scheduler:
    arrival-transition-cron: "0 0 6 * * *"
  jwt:
    secret: ${JWT_SECRET:bedok-dev-secret-key-that-is-at-least-256-bits-long-for-hs256}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
