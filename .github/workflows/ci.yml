# The stack assessment, the infrastructure research and the deployment pre-mortem all named the
# absent pipeline as the weakest point in the project: 143 tests that nothing ran automatically,
# in front of a deployment whose first cost-driven resize is expected to break the JVM.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, checkstyle, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is executable code committed to the repository; this checks it against the
      # published Gradle distributions rather than trusting it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # Compiles, runs Checkstyle (isIgnoreFailures = false) and runs the suite. The integration
      # tests start a real PostgreSQL 16 through Testcontainers -- hosted runners ship a Docker
      # daemon, so nothing extra is needed here. No JWT_SECRET either: application.yml has no
      # fallback outside the dev profile, and IntegrationTestBase registers its own key.
      - run: ./gradlew build --no-daemon

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 7

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # These run on a box nobody is watching, against an instance holding the only copy of the
      # database. A syntax error in them surfaces at the worst possible moment.
      - run: shellcheck --severity=warning deploy/*.sh

      # The cloud-init blob is assembled from these files at launch. Rendering it here catches a
      # delimiter collision or a missing placeholder now rather than on a box with no shell.
      - run: python3 deploy/render-user-data.py > /dev/null && echo "user data renders"
