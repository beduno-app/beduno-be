# Advisory code review on every PR, run by our own .claude/skills/pr-review skill via
# claude-code-action. Reviews correctness, multi-tenancy/security, and reuse/simplification —
# posts inline + summary comments, never blocks the merge. The build/checkstyle/test job in
# ci.yml is what gates merges; this is a second pair of eyes, not a gate.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/pr-review"
          show_full_output: "true"
          claude_args: |
            --model ~anthropic/claude-sonnet-latest[1m]
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
