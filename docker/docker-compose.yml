services:
  postgres:
    image: postgres:16-alpine
    container_name: beduno-postgres
    environment:
      POSTGRES_DB: beduno
      POSTGRES_USER: beduno
      POSTGRES_PASSWORD: beduno
    ports:
      - "5432:5432"
    volumes:
      - beduno-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beduno -d beduno"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  beduno-pgdata:
