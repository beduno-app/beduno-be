services:
  postgres:
    image: postgres:16-alpine
    container_name: bedok-postgres
    environment:
      POSTGRES_DB: bedok
      POSTGRES_USER: bedok
      POSTGRES_PASSWORD: bedok
    ports:
      - "5432:5432"
    volumes:
      - bedok-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bedok -d bedok"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bedok-pgdata:
